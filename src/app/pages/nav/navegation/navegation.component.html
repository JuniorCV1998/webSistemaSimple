<ion-app>
    <div class="app-shell">
        <header *ngIf="session && !outSession" class="app-header">
            <div class="flex flex-row justify-content-between align-items-center p-2">
                <div class="comp_volver">
                    <a *ngIf="showVolverButton" (click)="volver()"><i id="volver-icon" class="pi pi-angle-left"></i></a>
                </div>
                <img [src]="pathLogo" alt="Logo" height="55" class="rounded-lg shadow-sm border border-gray-200"
                    style="object-fit: contain; background-color: #fff; padding: 4px;">
            </div>
        </header>

        <div class="app-outlet">
            <ion-router-outlet [swipeGesture]="swipeHabilitado"></ion-router-outlet>
        </div>
    </div>
</ion-app>

<div>
    <p-toast [breakpoints]="{ '500px': { width: '80%', right: '1', left: '3' } }" />
</div>
