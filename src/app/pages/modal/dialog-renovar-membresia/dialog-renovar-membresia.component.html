<p-confirmDialog [visible]="visible" [closable]="false">
    <ng-template pTemplate="headless">
        <div class="rm-pop">
            <div class="rm-cabecera">
                <span class="rm-ico"><i class="pi pi-star-fill"></i></span>
                <h3 class="rm-titulo">Elige tu plan</h3>
                <p class="rm-sub">Mientras más tiempo, más ahorras.</p>
            </div>

            <div class="rm-cuerpo">
                <app-planes-membresia *ngIf="ajustes; else cargando" [ajustes]="ajustes"
                    [(seleccionado)]="seleccionado"></app-planes-membresia>
                <ng-template #cargando>
                    <div class="rm-cargando"><i class="pi pi-spin pi-spinner"></i></div>
                </ng-template>
            </div>

            <div class="rm-pie">
                <div class="rm-botones">
                    <button type="button" class="rm-btn rm-btn-sec" (click)="cerrar()">Ahora no</button>
                    <button type="button" class="rm-btn rm-btn-wa" [disabled]="!seleccionado" (click)="confirmar()">
                        <i class="pi pi-whatsapp"></i>Solicitar
                    </button>
                </div>
                <small *ngIf="ajustes?.contacto?.horario" class="rm-horario">
                    <i class="pi pi-clock"></i>Te atendemos {{ ajustes!.contacto.horario }}
                </small>
            </div>
        </div>
    </ng-template>
</p-confirmDialog>
