<div class="lu auth-fade-in" (click)="modoEdicion && cancelarEdicion()">

    <!-- Hero compacto con el logo -->
    <section class="lu-hero">
        <span *ngIf="appVersion!=''" class="lu-version">v{{appVersion}}</span>
        <div class="lu-logo">
            <img src="public/logos/logo_ssimple.png" alt="Sistema Simple">
        </div>
        <span class="lu-hero-titulo">Hola de nuevo</span>
        <span class="lu-hero-sub">Ingresa tu clave de 6 dígitos</span>
    </section>

    <!-- Selector de cuentas guardadas -->
    <div class="lu-cuentas">
        <div class="lu-carousel" #carousel (scroll)="onCarouselScroll()">
            <div class="lu-slide" *ngFor="let cuenta of cuentas; let i = index">
                <div class="lu-cuenta">
                    <span class="lu-cuenta-avatar">{{cuenta.charAt(0).toUpperCase()}}</span>
                    <span class="lu-cuenta-correo">{{cuenta}}</span>
                    <button *ngIf="modoEdicion" type="button" class="lu-cuenta-eliminar"
                        (click)="eliminarCuenta(i, $event)" aria-label="Eliminar cuenta">
                        <i class="pi pi-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="lu-dots-cuentas" *ngIf="cuentas.length > 1">
            <span *ngFor="let cuenta of cuentas; let i = index" class="lu-dot-cuenta"
                [class.lu-dot-cuenta-on]="i === cuentaActivaIndex" (click)="irACuenta(i)"></span>
        </div>
    </div>

    <p *ngIf="modoEdicion" class="lu-hint">
        <i class="pi pi-info-circle"></i> Máximo 3 cuentas. Elimina una para agregar otra.
    </p>

    <form #form="ngForm" class="lu-form">
        <!-- Clave ofuscada -->
        <div class="lu-pin" aria-label="Clave ingresada">
            <span *ngFor="let n of [1,2,3,4,5,6]" class="lu-pin-dot" [class.lu-pin-on]="enteredCode.length >= n"></span>
        </div>

        <!-- Teclado numérico aleatorio -->
        <div class="keypad">
            <button *ngFor="let number of randomNumbers.slice(0, 9)" (click)="onDigitPress(number)"
                class="keypad-button" type="button">
                {{ number }}
            </button>
            <!-- Ingreso rápido con huella para la cuenta activa (o espacio vacío para mantener la cuadrícula) -->
            <button *ngIf="biometriaDisponibleActiva" (click)="ingresarConBiometria()"
                class="keypad-button keypad-plano huella-button" type="button" aria-label="Ingresar con huella">
                <lottie-player src="/public/system/fingerprint.json" background="transparent" speed="1"
                    loop autoplay></lottie-player>
            </button>
            <div *ngIf="!biometriaDisponibleActiva" class="keypad-button" style="visibility: hidden;"></div>
            <!-- Último número -->
            <button *ngIf="randomNumbers.length > 9"
                (click)="onDigitPress(randomNumbers[randomNumbers.length - 1])"
                class="keypad-button" type="button">
                {{ randomNumbers[randomNumbers.length - 1] }}
            </button>
            <!-- Borrar -->
            <button (click)="onDelete()" class="keypad-button keypad-plano" type="button" aria-label="Borrar">
                <i class="pi pi-delete-left"></i>
            </button>
        </div>
    </form>

    <button type="button" class="lu-otra" (click)="usarOtraCuenta($event)">
        <i class="pi pi-user-plus"></i> Agregar otra cuenta
    </button>

</div>

<app-loading></app-loading>
