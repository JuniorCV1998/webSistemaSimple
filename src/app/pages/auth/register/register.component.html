<div class="au auth-fade-in">

    <button type="button" class="au-volver" (click)="volver()"><i class="pi pi-angle-left"></i>Volver</button>

    <section class="au-hero">
        <div class="au-logo"><img src="public/logos/logo_ssimple.png" alt="Sistema Simple"></div>
        <h1 class="au-titulo">Crea tu clave</h1>
        <span class="au-sub">La usarás para ingresar a la app</span>
        <div class="au-pasos"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>
        <span class="au-paso-text">Paso 3 de 4 · Clave</span>
    </section>

    <section class="au-card">
        <label for="email1" class="au-label">Correo electrónico</label>
        <div class="relative w-full">
            <i class="pi pi-envelope input-icon-left"></i>
            <input [(ngModel)]="objUser.correo" id="email1" type="email" inputmode="email" autocomplete="off"
                (focus)="onFocus(1)" (blur)="onBlur(1)" placeholder="tucorreo@gmail.com" pInputText
                class="w-full input-with-icon" (ngModelChange)="objUser.correo = $event.toLowerCase()">
        </div>
        <small *ngIf="isWriting" class="au-ayuda">
            <i class="pi pi-info-circle"></i>Usaremos este correo para enviarte información sobre tu cuenta.
        </small>

        <label for="password1" class="au-label">Clave de 6 dígitos</label>
        <div class="relative w-full">
            <i class="pi pi-lock input-icon-left"></i>
            <input [(ngModel)]="objUser.contrasena" id="password1" [maxlength]="6" inputmode="numeric" appSoloNumeros
                (ngModelChange)="isValidPassword = validarContrasena(objUser.contrasena.trim())"
                [type]="passwordFieldType" placeholder="••••••" (focus)="onFocus(2)" (blur)="onBlur(2)"
                pInputText class="w-full input-with-icon">
            <i class="pi input-icon-right" [ngClass]="passwordFieldType === 'password' ? 'pi-eye' : 'pi-eye-slash'"
                (click)="togglePasswordVisibility(1)"></i>
        </div>
        <small *ngIf="isWritingP || (!isValidPassword && objUser?.contrasena?.length > 0)" class="au-ayuda"
            [class.au-error]="!isValidPassword && objUser?.contrasena?.length > 0">
            <i class="pi pi-info-circle"></i>Debe tener exactamente 6 números.
        </small>

        <label for="password2" class="au-label">Confirmar clave</label>
        <div class="relative w-full">
            <i class="pi pi-lock input-icon-left"></i>
            <input [(ngModel)]="objUser.contrasena2" id="password2" [type]="passwordFieldType2" [maxlength]="6"
                inputmode="numeric" appSoloNumeros placeholder="••••••" pInputText class="w-full input-with-icon">
            <i class="pi input-icon-right" [ngClass]="passwordFieldType2 === 'password' ? 'pi-eye' : 'pi-eye-slash'"
                (click)="togglePasswordVisibility(2)"></i>
        </div>
        <small *ngIf="objUser?.contrasena2?.length === 6 && objUser.contrasena2 !== objUser.contrasena" class="au-ayuda au-error">
            <i class="pi pi-info-circle"></i>Las claves no coinciden.
        </small>

        <label class="au-label">Código único</label>
        <p-inputOtp [(ngModel)]="codigoUnico" [integerOnly]="true" [length]="6" (input)="onInputChange()" />
        <span class="au-chip mt-2" [class.au-chip-ok]="codigoUnico.length == 6">
            <i class="pi" [ngClass]="codigoUnico.length == 6 ? 'pi-check-circle' : 'pi-qrcode'"></i>SS - {{valueShow}}
        </span>

        <div class="au-acciones au-acciones-una">
            <button type="button" class="au-btn" (click)="validarDatos()" [disabled]="!isFormValid()">
                Continuar <i class="pi pi-arrow-right"></i>
            </button>
        </div>
    </section>

</div>

<app-loading></app-loading>
