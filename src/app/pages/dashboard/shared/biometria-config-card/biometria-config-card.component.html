<section class="bc-card">
    <div class="bc-head">
        <span class="bc-ico">
            <lottie-player class="biometria-icon" src="/public/system/fingerprint.json"
                background="transparent" speed="1" loop autoplay></lottie-player>
        </span>
        <span class="bc-head-text">
            <span class="bc-titulo">Ingreso con huella</span>
            <span class="bc-desc">
                <ng-container *ngIf="biometriaSoportada; else noSoportado">
                    Ingresa rápido con tu huella, sin escribir tu clave cada vez. Puedes desactivarlo cuando quieras.
                </ng-container>
                <ng-template #noSoportado>
                    Tu dispositivo no cuenta con sensor de huella dactilar disponible.
                </ng-template>
            </span>
        </span>
        <p-toggleswitch [(ngModel)]="biometriaActiva" [ngModelOptions]="{standalone: true}"
            [disabled]="!biometriaSoportada" (ngModelChange)="onToggleBiometria($event)">
            <ng-template #handle let-checked="checked">
                <i [ngClass]="['!text-xs', 'pi', checked ? 'pi-check' : 'pi-times']"></i>
            </ng-template>
        </p-toggleswitch>
    </div>

    <div *ngIf="mostrarConfirmarActivacion" class="bc-confirmar">
        <span class="bc-desc">Ingresa tu clave de 6 dígitos para confirmar la activación.</span>
        <div class="bc-confirmar-fila">
            <input type="password" pInputText inputmode="numeric" maxlength="6" [ngModel]="passwordConfirmacion"
                (ngModelChange)="onPasswordConfirmacionChange($event)" [ngModelOptions]="{standalone: true}"
                placeholder="Clave de 6 dígitos" class="bc-input" />
            <button pButton icon="pi pi-check" class="bc-btn" [disabled]="passwordConfirmacion.length !== 6"
                (click)="confirmarActivacionBiometria()" aria-label="Confirmar"></button>
            <button pButton icon="pi pi-times" class="p-button-outlined bc-btn"
                (click)="cancelarActivacionBiometria()" aria-label="Cancelar"></button>
        </div>
    </div>
</section>
