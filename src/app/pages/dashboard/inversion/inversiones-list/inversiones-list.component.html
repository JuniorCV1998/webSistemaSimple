<div *ngIf="!isLoading" class="il">

    <div class="il-head">
        <span class="text-2xl label-title">Inversiones</span>
        <span *ngIf="descripcion" class="il-desc">{{descripcion}}</span>
    </div>

    <!-- Buscador tipo píldora -->
    <div class="il-search">
        <i class="pi pi-search il-search-icon"></i>
        <input type="text" placeholder="Buscar por nombre o cód. op." pInputText appLetrasNumerosGuiones
            [(ngModel)]="value" (input)="filtrarInversiones()" class="w-full" />
        <i *ngIf="value" class="pi pi-times-circle il-search-clear" (click)="clearFilter()"></i>
    </div>

    <!-- Abierto / Cerrado -->
    <div class="il-segment">
        <button type="button" [class.active]="open" (click)="changeOpen(true)">Abiertas</button>
        <button type="button" [class.active]="!open" (click)="changeOpen(false)">Cerradas</button>
    </div>

    <section class="il-card">
        <app-list-empty *ngIf="totalListCount==0"></app-list-empty>

        <ng-container *ngIf="totalListCount!=0">
            <button type="button" *ngFor="let object of listPaginador" class="il-item"
                [class.il-item-cerrada]="object.estadoDeuda!='P'" (click)="abrirCartilla(object.idInversion)">
                <span class="il-avatar">{{object.avatar}}</span>
                <span class="il-item-text">
                    <span class="il-nombre">{{object.nombres + ' '+object.apellidoPaterno + ' ' + object.apellidoMaterno}}</span>
                    <span class="il-fecha">{{object.fechaModificacion}}</span>
                </span>
                <span class="il-derecha">
                    <span class="il-nro">#{{object.nroInversion}}</span>
                    <span *ngIf="object.nroCuota==4" class="il-sem">Semanal</span>
                </span>
                <i class="pi pi-angle-right il-flecha"></i>
            </button>

            <div *ngIf="paginas > 1" class="il-paginador">
                <span class="il-pag-info">{{totalListCount}} registros · Pág. {{paginaActual}} de {{paginas}}</span>
                <span class="il-pag-btns">
                    <button type="button" [disabled]="!isBack" (click)="paginaAnterior()" aria-label="Página anterior">
                        <i class="pi pi-angle-left"></i>
                    </button>
                    <button type="button" [disabled]="!isNext" (click)="siguientePagina()" aria-label="Página siguiente">
                        <i class="pi pi-angle-right"></i>
                    </button>
                </span>
            </div>
        </ng-container>
    </section>

    <div style="height: 60px;"></div>
</div>

<app-loading *ngIf="isLoading"></app-loading>
