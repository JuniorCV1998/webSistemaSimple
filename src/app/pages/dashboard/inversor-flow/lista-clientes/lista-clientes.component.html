<div class="lc">

    <div class="lc-head">
        <div class="text-2xl label-title">Clientes</div>
        <span class="lc-desc">Consulta los datos y préstamos de cada cliente.</span>
    </div>

    <!-- Buscador -->
    <div class="lc-search">
        <i class="pi pi-search lc-search-icon"></i>
        <input (input)="filtrarCliente()" id="buscar-cliente" name="usuario" [(ngModel)]="busqueda" [maxlength]="30"
            type="text" placeholder="Buscar por nombre o celular" pInputText autocomplete="off" class="w-full"
            [disabled]="isLoading">
        <i *ngIf="busqueda" class="pi pi-times-circle lc-search-clear" (click)="cleanFiltroFunct()"></i>
    </div>

    <!-- Lista -->
    <div class="lc-seccion">
        <span>Tus clientes</span>
        <span *ngIf="!isLoading && totalClientes" class="lc-count">{{totalClientes}}</span>
    </div>
    <section class="lc-lista">

        <ng-container *ngIf="isLoading">
            <div *ngFor="let item of [].constructor(forSkeleton)" class="lc-item">
                <p-skeleton shape="circle" size="44px" />
                <div class="flex flex-column w-full gap-2">
                    <p-skeleton width="70%" height="1rem" />
                    <p-skeleton width="35%" height=".8rem" />
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="!isLoading">
            <div *ngIf="filtroVacio && listaClientesRecovery.length != 0" class="lc-empty">
                <i class="pi pi-search-minus"></i>
                <span>No encontramos a <b>"{{busqueda}}"</b> entre tus clientes.</span>
            </div>

            <div *ngIf="listaClientesRecovery.length == 0" class="lc-empty">
                <i class="pi pi-users"></i>
                <span>Aún no tienes clientes registrados.</span>
            </div>

            <button type="button" *ngFor="let cliente of listaClientes" class="lc-item lc-item-btn"
                [routerLink]="['/cliente']" [queryParams]="{ idUsuario: cliente.idUsuario }">
                <span class="lc-avatar">{{ iniciales(cliente.persona) }}</span>
                <span class="lc-item-text">
                    <span class="lc-nombre">{{cliente.persona.nombres+' '+cliente.persona.apellidoPaterno+' '+cliente.persona.apellidoMaterno}}</span>
                    <span class="lc-celular" *ngIf="cliente.persona.celular">
                        <i class="pi pi-phone"></i>{{ formatNumberEspaciado(cliente.persona.celular) }}
                    </span>
                </span>
                <i class="pi pi-angle-right lc-chevron"></i>
            </button>
        </ng-container>
    </section>

    <div style="height: 50px;"></div>
</div>
