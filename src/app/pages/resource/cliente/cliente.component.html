<div class="flujo">

    <app-flow-steps [pasos]="pasos" [actual]="pasoActual" titulo="Datos del Cliente"
        /> <!-- subtitulo="Elige uno de tus clientes o registra uno nuevo."  -->

    <!-- Buscador -->
    <div class="cl-search">
        <i class="pi pi-search cl-search-icon"></i>
        <input (input)="filtrarCliente()" id="buscar-cliente" name="busqueda" [(ngModel)]="busqueda" [maxlength]="30"
            type="text" placeholder="Buscar por nombre o celular" pInputText autocomplete="off" class="w-full">
        <i *ngIf="busqueda" class="pi pi-times-circle cl-search-clear" (click)="cleanFiltroFunct()"></i>
    </div>

    <!-- Nuevo cliente -->
    <button type="button" class="cl-nuevo" [routerLink]="'/registro/clientenuevo'">
        <span class="cl-nuevo-icon"><i class="pi pi-user-plus"></i></span>
        <span class="cl-nuevo-text">
            <span class="cl-nuevo-title">Nuevo cliente</span>
            <span class="cl-nuevo-desc">Registra sus datos y le creamos su acceso</span>
        </span>
        <i class="pi pi-angle-right cl-chevron"></i>
    </button>

    <!-- Lista -->
    <div class="cl-seccion">
        <span>Tus clientes</span>
        <span *ngIf="!isLoading && listaClientesRecovery.length" class="cl-count">{{listaClientesRecovery.length}}</span>
    </div>
    <section class="cl-lista">

        <ng-container *ngIf="isLoading">
            <div *ngFor="let item of [].constructor(forSkeleton)" class="cl-item">
                <p-skeleton shape="circle" size="42px" />
                <div class="flex flex-column w-full gap-2">
                    <p-skeleton width="70%" height="1rem" />
                    <p-skeleton width="35%" height=".8rem" />
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="!isLoading">
            <div *ngIf="filtroVacio && listaClientesRecovery.length != 0" class="cl-empty">
                <i class="pi pi-search-minus"></i>
                <span>No encontramos a <b>"{{busqueda}}"</b> entre tus clientes.</span>
            </div>

            <div *ngIf="listaClientesRecovery.length == 0" class="cl-empty">
                <i class="pi pi-user-plus"></i>
                <span>Aún no tienes clientes registrados. Usa <b>Nuevo cliente</b> para agregar el primero.</span>
            </div>

            <button type="button" *ngFor="let cliente of listaClientes" class="cl-item cl-item-btn"
                (click)="seleccionarCliente(cliente.idUsuario)">
                <span class="flujo-avatar">{{ iniciales(cliente.persona) }}</span>
                <span class="cl-item-text">
                    <span class="cl-nombre">{{cliente.persona.nombres+' '+cliente.persona.apellidoPaterno+' '+cliente.persona.apellidoMaterno}}</span>
                    <span class="cl-celular" *ngIf="cliente.persona.celular">
                        <i class="pi pi-phone"></i>{{ celular(cliente.persona) }}
                    </span>
                </span>
                <i class="pi pi-angle-right cl-chevron"></i>
            </button>
        </ng-container>
    </section>

    <div style="height: 20px;"></div>
</div>
