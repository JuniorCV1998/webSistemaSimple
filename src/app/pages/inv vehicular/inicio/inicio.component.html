<div class="vi">

    <div class="vi-head">
        <div class="text-2xl label-title">Crédito vehicular</div>
        <span class="vi-desc">Tus inversiones en vehículos y lo recaudado en cada una.</span>
    </div>

    <!-- Nueva inversión -->
    <button *ngIf="perfil=='INV'" type="button" class="vi-nuevo" (click)="selectClient()">
        <span class="vi-nuevo-ico"><i class="pi pi-car"></i></span>
        <span class="vi-nuevo-text">
            <span class="vi-nuevo-titulo">Nueva inversión vehicular</span>
            <span class="vi-nuevo-desc">Elige al cliente y registra el vehículo</span>
        </span>
        <i class="pi pi-plus vi-nuevo-mas"></i>
    </button>

    <!-- Pendientes / Finalizados / Cerrados -->
    <div class="vi-segment">
        <button type="button" [class.active]="estado=='P'" (click)="changeOpen('P')">Pendientes</button>
        <button type="button" [class.active]="estado=='F'" (click)="changeOpen('F')">Finalizados</button>
        <button type="button" [class.active]="estado=='C'" (click)="changeOpen('C')">Cerrados</button>
    </div>

    <section class="vi-card">
        <!-- Skeleton -->
        <ng-container *ngIf="isLoading">
            <div *ngFor="let item of [].constructor(forSkeleton)" class="vi-item">
                <p-skeleton shape="circle" size="44px" />
                <div class="flex flex-column w-full gap-2">
                    <p-skeleton width="65%" height="1rem" />
                    <p-skeleton width="40%" height=".8rem" />
                </div>
                <p-skeleton width="64px" height="1rem" />
            </div>
        </ng-container>

        <ng-container *ngIf="!isLoading">
            <button type="button" *ngFor="let inversion of listInvVehiculares" class="vi-item vi-item-btn"
                [class.vi-item-cerrado]="estado=='C'" [class.vi-item-finalizado]="estado=='F'"
                [routerLink]="['/vehicular/inversiondetalle']" [queryParams]="{ idInversionVeh: inversion.idInversionVeh }">
                <span class="vi-ico">
                    <i class="pi pi-car"></i>
                    <span *ngIf="estado=='F'" class="vi-check"><i class="pi pi-check"></i></span>
                    <span class="vi-colores">
                        <span [ngStyle]="{'background-color': inversion.color1}"></span>
                        <span [ngStyle]="{'background-color': inversion.color2}"></span>
                    </span>
                </span>
                <span class="vi-item-text">
                    <span class="vi-nombre">{{inversion.fullName}}</span>
                    <span class="vi-sub">{{inversion.descripcion}}</span>
                    <span *ngIf="inversion.fechaActualizado" class="vi-fecha">{{inversion.fechaActualizado}}</span>
                </span>
                <span *ngIf="perfil=='INV'" class="vi-derecha">
                    <span class="vi-monto">{{currency}} {{inversion.totalPagado | formatNumber}}</span>
                    <span class="vi-monto-label">Recaudado</span>
                </span>
            </button>

            <div *ngIf="listInvVehiculares.length==0" class="vi-empty">
                <i class="pi pi-car"></i>
                <span *ngIf="estado=='P'">Aún no tienes inversiones activas.</span>
                <span *ngIf="estado=='F'">Aún no tienes inversiones pagadas por completo.</span>
                <span *ngIf="estado=='C'">Aún no tienes inversiones cerradas.</span>
            </div>
        </ng-container>
    </section>

    <div style="height: 30px;"></div>

    <div>
        <p-toast [breakpoints]="{ '500px': { width: '80%', right: '1', left: '3' } }" />
    </div>
</div>
