<div *ngIf="!isLoading" class="flujo rg">

    <!-- Encabezado de éxito -->
    <section class="rg-exito">
        <div class="rg-icono" (click)="triggerConfetti()">
            <i class="pi pi-car"></i>
            <span class="rg-check"><i class="pi pi-check"></i></span>
        </div>
        <h1 class="rg-titulo label-title">¡Inversión registrada!</h1>
        <p class="rg-sub">¡Genial! Tu registro se realizó con éxito</p>
    </section>

    <!-- Resumen -->
    <section class="flujo-card rg-card">
        <h2 class="flujo-card-title"><i class="pi pi-user"></i> Cliente</h2>
        <div class="rg-cliente">
            <span class="flujo-avatar">{{iniciales}}</span>
            <div class="rg-cliente-text">
                <span class="rg-nombre">{{objInversionVeh.fullName}}</span>
                <span *ngIf="objInversionVeh.descripcion" class="rg-desc">{{objInversionVeh.descripcion}}</span>
            </div>
        </div>

        <dl class="rg-list">
            <div>
                <dt><i class="pi pi-clock"></i> Fecha de registro</dt>
                <dd>{{objInversionVeh.fechaCreacion}}</dd>
            </div>
        </dl>
    </section>

    <a class="rg-ver" [routerLink]="['/vehicular/inversiondetalle']"
        [queryParams]="{ idInversionVeh: objInversionVeh.idInversionVeh, from: 'registerVeh' }">
        <span class="rg-ver-ico"><i class="pi pi-eye"></i></span>
        <span class="rg-ver-text">
            <span class="rg-ver-titulo">Ver inversión</span>
            <span class="rg-ver-sub">Cuotas, cronograma y pagos</span>
        </span>
        <i class="pi pi-angle-right rg-ver-flecha"></i>
    </a>

    <div style="height: 70px;"></div>
    <button pButton pRipple label="Ver inversiones" routerLink="/vehicular/inicio" class="btn-float"></button>
</div>

<app-loading *ngIf="isLoading"></app-loading>
