<div class="ua">
    <lottie-player class="ua-anim" src="/public/system/update-app.json" background="transparent" speed="1" loop
        autoplay></lottie-player>

    <h3 class="ua-titulo">{{ header }}</h3>
    <span *ngIf="respVersion.version" class="ua-version"><i class="pi pi-sparkles"></i>Versión {{respVersion.version}}</span>

    <p *ngIf="respVersion.descripcion" class="ua-texto" [innerHTML]="respVersion.descripcion"></p>

    <div class="ua-botones">
        <button type="button" class="ua-btn" (click)="actualizarApp()">
            <i class="pi pi-download"></i> Actualizar ahora
        </button>
        <button *ngIf="!respVersion.mandatorio" type="button" class="ua-btn ua-btn-sec" (click)="continuar()">
            Más tarde
        </button>
    </div>
</div>
