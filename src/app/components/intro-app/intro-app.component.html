<div class="intro" [class.intro-saliendo]="saliendo" aria-hidden="true">
    <span class="intro-brillo intro-brillo-a"></span>
    <span class="intro-brillo intro-brillo-b"></span>

    <div class="intro-centro">
        <div class="intro-logo">
            <svg class="intro-anillo" viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="introDegradado" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#60a5fa" />
                        <stop offset="100%" stop-color="#10b981" />
                    </linearGradient>
                </defs>
                <circle cx="60" cy="60" r="56" />
            </svg>
            <img src="public/logos/logo_ssimple.png" alt="">
        </div>

        <h1 class="intro-nombre">
            <span>Ssimple</span><span class="intro-pay">Pay</span>
        </h1>
        <p class="intro-lema">Tus préstamos, bajo control</p>
    </div>

    <div class="intro-barra"><span></span></div>
</div>
